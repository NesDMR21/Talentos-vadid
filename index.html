    <script>
      // La intro animada solo se muestra en la primera visita de la sesión y
      // nunca a quien tiene activado "reducir movimiento".
      try {
        var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches
        if (reduce || sessionStorage.getItem('vadid-intro')) {
          document.documentElement.classList.add('no-intro')
        } else {
          sessionStorage.setItem('vadid-intro', '1')
        }
      } catch (e) {
        document.documentElement.classList.add('no-intro')
      }
    </script>
